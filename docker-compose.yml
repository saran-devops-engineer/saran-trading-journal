services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pass
      POSTGRES_DB: trading_journal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://trading_user:trading_pass@db:5432/trading_journal
      SECRET_KEY: change-this-to-a-random-secret-key
      ENCRYPTION_KEY: change-this-to-a-random-32-byte-key!!
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
